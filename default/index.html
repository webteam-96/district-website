    <!-- Link preview (WhatsApp / Facebook / X / LinkedIn). Static, and generic on
         purpose: the district is resolved from the rid<NNNN> subdomain in JS and
         scrapers do not run JS, so these must hold for every district this one
         shared build serves. og:image must be ABSOLUTE (Twitterbot and LinkedIn do not
         resolve relative ones); the file is byte-identical on all 43 hosts, so the
         default tenant’s host is used as the one canonical source. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rotary District" />
    <meta property="og:title" content="Rotary District" />
    <meta
      property="og:description"
      content="Official Rotary District website — clubs, projects, events, district committee and awards."
    />
    <meta property="og:image" content="https://rid3011.rotaryindia.org/assets/img/banner-default.png" />
    <meta property="og:image:width" content="1916" />
    <meta property="og:image:height" content="1020" />
