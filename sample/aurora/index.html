<!doctype html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotary District 3141 | Aurora</title>
  <meta name="description" content="Rotary District 3141, Mumbai: clubs, projects, events and leadership.">
  <script>/* apply the saved theme before first paint; aurora defaults to dark */
    try { var t = localStorage.getItem('aurora-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="../shared/img/rotary-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="preloader" data-preloader aria-hidden="true">
    <span class="pre-glow"></span>
    <img class="logo-dark" src="../shared/img/rotary-logo-reversed.png" alt="" width="199" height="74">
    <img class="logo-light" src="../shared/img/rotary-logo.png" alt="" width="199" height="74">
    <span class="preloader-rule"></span>
  </div>

  <header class="site-header" data-header>
    <div class="topbar"><div class="wrap topbar-in" id="topbar"></div></div>
    <div class="header-bar"><div class="wrap">
      <div class="header-in">
        <a class="brand" href="#top" id="brand"></a>
        <nav class="nav" aria-label="Main"><ul role="list" id="nav"></ul></nav>
        <div class="pill-actions">
          <button class="icon-round" type="button" data-kbar aria-label="Search clubs" aria-keyshortcuts="Control+K Meta+K">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          </button>
          <button class="icon-round theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
          </button>
          <div class="header-actions" id="header-actions"></div>
          <button class="burger" type="button" data-menu-toggle aria-expanded="false" aria-controls="menu" aria-label="Menu"><span></span><span></span></button>
        </div>
      </div>
    </div></div>
  </header>

  <div class="menu" id="menu" data-menu></div>

  <main id="main"></main>
  <footer class="footer" id="footer"></footer>

  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="../shared/content.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
